name: ci

on:
  workflow_dispatch:
  push:

jobs:
  build-mounting-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        run: sudo apt-get install -y tar shellcheck
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # https://github.com/actions/checkout/tree/v4.2.2
      - name: Build
        run: make PBG_VERSION=${{ github.ref_name }}
      - name: Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # https://github.com/softprops/action-gh-release/tree/v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: false
          files: "pixel-backup-gang-*.tar.gz"
          token: ${{ secrets.MY_GITHUB_TOKEN }}

  build-boot-images:
    runs-on: ${{ matrix.host.runner }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
        device:
          - codename: marlin
            build_id: "QP1A.191005.007.A3"
          - codename: marlin
            build_id: "QP1A.191005.007.A1"
          - codename: sailfish
            build_id: "QP1A.191005.007.A1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # https://github.com/actions/checkout/tree/v4.2.2
      - name: Enable legacy x86_64 toolchains on ARM64
        if: matrix.host.system == 'aarch64-linux'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: amd64
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # https://github.com/cachix/install-nix-action/tree/v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = x86_64-linux
      - name: Verify factory kernel extraction and repacking
        env:
          TARGET: .#${{ matrix.device.codename }}."${{ matrix.device.build_id }}".checks.factoryKernelRoundtrip
        run: nix build --print-build-logs --no-update-lock-file --no-link "$TARGET"
      - name: Build rooted & NFS-enabled boot.img
        env:
          TARGET: .#${{ matrix.device.codename }}."${{ matrix.device.build_id }}".magiskBootImages.specialNfs
        run: nix build --print-build-logs --no-update-lock-file "$TARGET"
      - name: Verify boot.img exists
        run: test -s result/boot.img
      - name: Verify embedded NFS configuration and boot image sizes
        env:
          TARGET: .#${{ matrix.device.codename }}."${{ matrix.device.build_id }}".checks
        run: nix build --print-build-logs --no-update-lock-file --no-link "$TARGET.nfsKernelConfig" "$TARGET.bootImageSizes"
      - name: Rename boot.img and compute its checksum
        env:
          TARGET: .#${{ matrix.device.codename }}."${{ matrix.device.build_id }}".magiskBootImages.specialNfs.name
        run: |
          name=$(nix eval --raw "$TARGET")-${{ github.ref_name }}
          cp result/boot.img "$name.img"
          sha256sum "$name.img" > "$name.img.sha256"
      - name: Upload boot.img as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # https://github.com/actions/upload-artifact/tree/v7.0.1
        if: "!startsWith(github.ref, 'refs/tags/') || matrix.host.system == 'aarch64-linux'"
        with:
          name: rootedSpecialNfsBootImg-${{ matrix.device.codename }}-${{ matrix.device.build_id }}-${{ matrix.host.system }}
          path: |
            *.img
            *.img.sha256
      # Publish one canonical image per device/build. ARM64 builds remain
      # available as workflow artifacts, avoiding duplicate release assets.
      - name: Attach boot.img to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # https://github.com/softprops/action-gh-release/tree/v2.2.1
        if: startsWith(github.ref, 'refs/tags/') && matrix.host.system == 'x86_64-linux'
        with:
          prerelease: false
          files: |
            *.img
            *.img.sha256
          token: ${{ secrets.MY_GITHUB_TOKEN }}
